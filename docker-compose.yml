services:
  meally:
    image: ghcr.io/bachtly/meally:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # DATABASE_URL: postgres://meally:change-me@postgres:5432/meally   # optional; default is embedded PGlite
      BASE_URL: http://localhost:8080
      MEALLY_SIGNUP_MODE: invite
    volumes:
      - meally-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional: docker compose --profile postgres up -d (and set DATABASE_URL above)
  postgres:
    profiles: ["postgres"]
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: meally
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: meally
    volumes:
      - meally-pg:/var/lib/postgresql/data

volumes:
  meally-data:
  meally-pg:
