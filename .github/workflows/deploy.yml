name: Deploy (Supabase + Cloudflare Pages)
# Deploys main automatically once CI has passed on it, or by hand (Actions > Deploy > Run workflow).
# PRs are merged without waiting for CI, so CI on main is the gate: a red main never reaches production.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
# One deploy at a time. A newer queued run replaces an older queued one; a running deploy is never cancelled
# (it may be mid-migration).
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI just passed, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Skip if main has moved on
        id: fresh
        # CI runs for two quick merges can finish out of order; never deploy an older commit over a newer one.
        # The newer commit's own CI run will deploy it.
        run: |
          git fetch -q origin main
          if [ "${{ github.event_name }}" = workflow_run ] && [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "main is at $(git rev-parse --short origin/main), this run is for $(git rev-parse --short HEAD); skipping."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != '1'
        with:
          node-version: 24
      - uses: hashicorp/setup-terraform@v3
        if: steps.fresh.outputs.skip != '1'
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: bash scripts/deploy.sh
        if: steps.fresh.outputs.skip != '1'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
